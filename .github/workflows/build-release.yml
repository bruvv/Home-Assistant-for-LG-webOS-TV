name: Build and release IPK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test package build
        run: python -m unittest discover -s tests -v
      - name: Build IPK and prepare release notes
        run: |
          python build.py
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          info = json.loads(pathlib.Path('app/appinfo.json').read_text())
          version = info['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid version'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          pattern = r'^## \[' + re.escape(version)
          pattern += r'\][^\n]*\n(.*?)(?=^## |\Z)'
          match = re.search(pattern, changelog, re.M | re.S)
          assert match and match[1].strip(), 'Missing changelog entry'
          pathlib.Path('release-notes.md').write_text(match[1].strip() + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VERSION={version}\nIPK={info["id"]}_{version}_all.ipk\n')
          PY
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: home-assistant-webos-${{ env.VERSION }}
          path: ${{ env.IPK }}
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python - <<'PY'
          import json
          print(json.load(open('app/appinfo.json'))['version'])
          PY
          )
          # Fail on API errors instead of treating them as a missing release.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[].tag_name' > released-tags.txt
          if grep -Fxq "v$VERSION" released-tags.txt; then
            echo "v$VERSION is already released."
            exit 0
          fi
          python build.py
          python - <<'PY'
          import json
          import pathlib
          import re
          info = json.loads(pathlib.Path('app/appinfo.json').read_text())
          pattern = r'^## \[' + re.escape(info['version'])
          pattern += r'\][^\n]*\n(.*?)(?=^## |\Z)'
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          notes = re.search(pattern, changelog, re.M | re.S)
          pathlib.Path('release-notes.md').write_text(notes[1].strip() + '\n')
          PY
          gh release create "v$VERSION" ./*.ipk home-assistant/ha-tv-scroll.js \
            --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file release-notes.md
